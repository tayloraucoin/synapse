name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · boundaries · types · build
    runs-on: ubuntu-latest
    env:
      # Vercel Remote Cache — set TURBO_TOKEN (secret) and TURBO_TEAM (variable) in GitHub repo settings.
      # https://turborepo.com/docs/guides/ci-vendors/github-actions#remote-caching-with-vercel-remote-cache
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: check-specs and check-test-weakening compare with
          # origin/main, which a depth-2 pull-request checkout does not have.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # One command, the same one an agent and a person run locally: the repo's
      # lint, boundaries, types, smoke test and build, then the practice's checks
      # (record 0001).
      # SKIP_ENV_VALIDATION because CI has no secrets and must not need any:
      # the build compiles against types, and @syn/db's client is a lazy proxy
      # that never opens a connection at build time. A CI that needed a
      # database would be a CI that cannot run on a fork's pull request.
      - name: Verify
        run: yarn verify
        env:
          SKIP_ENV_VALIDATION: "true"
